version: '3.8'
services:
  plane:
    image: artifacts.plane.so/makeplane/plane-frontend:v0.28.0
    environment:
      - PGHOST=postgres
      - PGDATABASE=plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=devroot
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://172.32.1.9:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
