version: "3.8"
services:
  purebliss-plane:
    image: makeplane/plane:app-latest
    container_name: purebliss-plane
    networks:
      - purebliss-net
    ports:
      - "8082:8080"
    environment:
      - PLANE_DATABASE_URL=postgresql://admin:admin@postgres:5432/plane
      - PLANE_REDIS_URL=redis://purebliss-redis:6379/0
      - PLANE_SECRET_KEY=changeme
      - PLANE_VAULT_ADDR=http://purebliss-vault:8200
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | nc localhost 8080 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  purebliss-net:
    external: true
