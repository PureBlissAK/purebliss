version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.17.3
    container_name: purebliss-vault-scaffolding
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=purebliss-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_TOKEN=purebliss-root-token
    command: ["vault", "server", "-dev"]
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://localhost:8200 VAULT_TOKEN=purebliss-root-token vault status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - purebliss-scaffolding

networks:
  purebliss-scaffolding:
    driver: bridge
