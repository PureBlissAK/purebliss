version: '3.8'
services:
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: purebliss-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Simple dev mode without database for initial scaffolding
    ports:
      - "8080:8080"
    # Standalone scaffolding: dependencies must be running separately if needed
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3' | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
