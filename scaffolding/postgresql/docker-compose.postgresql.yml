services:
  purebliss-postgresql-scaffolding:
    image: postgres:16-alpine
    container_name: purebliss-postgresql-scaffolding
    networks:
      - purebliss-scaffolding
    environment:
      POSTGRES_DB: purebliss_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: purebliss-postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purebliss_dev"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  purebliss-scaffolding:
    external: true

volumes:
  postgresql_data:
    name: purebliss-postgresql-scaffolding-data
