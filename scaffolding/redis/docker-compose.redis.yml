services:
  purebliss-redis-scaffolding:
    image: redis:7-alpine
    container_name: purebliss-redis-scaffolding
    networks:
      - purebliss-scaffolding
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  purebliss-scaffolding:
    external: true

volumes:
  redis_data:
    name: purebliss-redis-scaffolding-data
