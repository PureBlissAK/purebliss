version: '3.8'
services:
  purebliss-prometheus:
    image: prom/prometheus:latest
    container_name: purebliss-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'GET /-/healthy HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | nc localhost 9090 | head -n 1 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
