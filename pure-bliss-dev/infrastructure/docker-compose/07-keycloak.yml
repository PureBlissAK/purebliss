services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: purebliss-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=purebliss-admin-2024
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://purebliss-postgres:5432/purebliss_dev
      - KC_DB_USERNAME=purebliss
      - KC_DB_PASSWORD=purebliss-db-pass
      - KC_HOSTNAME=dev.purebliss.app
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    networks:
      - purebliss-net
    depends_on:
      - postgres
      - nginx
    command: >
      sh -c "
      echo 'Starting Keycloak for Pure Bliss Elite Social Media Platform...' &&
      echo 'Target: 107,500 customers/year, 75K Instagram, 50K YouTube' &&
      /opt/keycloak/bin/kc.sh start-dev --import-realm
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  purebliss-net:
    external: true
