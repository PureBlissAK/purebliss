services:
  vault:
    image: hashicorp/vault:1.17.3
    container_name: purebliss-vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_LOCAL_CONFIG={"storage":{"file":{"path":"/vault/data"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"default_lease_ttl":"168h","max_lease_ttl":"720h","ui":true}
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
    ports:
      - "18200:8200"
    networks:
      - purebliss-net
    command: vault server -config=/vault/config/local.json
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault-data:
  vault-logs:

networks:
  purebliss-net:
    external: true
