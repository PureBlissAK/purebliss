services:
  nginx:
    image: nginx:latest
    container_name: purebliss-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../../shared/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../shared/configs/nginx/certs:/etc/nginx/certs:ro
      - ../../shared/configs/nginx/webroot:/var/www/certbot:ro
    networks:
      - purebliss-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: purebliss-certbot
    volumes:
      - ../../shared/configs/nginx/letsencrypt:/etc/letsencrypt
      - ../../shared/configs/nginx/webroot:/var/www/certbot
      - /var/log/letsencrypt:/var/log/letsencrypt
    networks:
      - purebliss-net
    environment:
      - CERTBOT_EMAIL=admin@purebliss.app
      - CERTBOT_DOMAIN=dev.purebliss.app
    command: >
      sh -c "
      echo 'Pure Bliss Elite Social Media Platform - LetsEncrypt SSL Management' &&
      echo 'Target: 107,500 customers/year, 75K Instagram, 50K YouTube' &&
      while true; do
        certbot certonly --webroot --webroot-path=/var/www/certbot 
        --email admin@purebliss.app --agree-tos --no-eff-email --staging
        -d dev.purebliss.app || echo 'Certificate exists or registration failed';
        sleep 12h;
      done
      "
    restart: unless-stopped

networks:
  purebliss-net:
    external: true
