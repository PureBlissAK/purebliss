user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings for Pure Bliss Elite Social Media Platform
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTTP server - redirect to HTTPS and serve ACME challenges
    server {
        listen 80;
        server_name dev.purebliss.app;

        # LetsEncrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server for Pure Bliss platform
    server {
        listen 443 ssl http2;
        server_name dev.purebliss.app;

        # SSL configuration
        ssl_certificate /etc/nginx/certs/dev.purebliss.app.crt;
        ssl_certificate_key /etc/nginx/certs/dev.purebliss.app.key;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

        # Pure Bliss Elite Social Media Platform routes
        
        # Code Server - Web IDE (Primary development environment)
        location /codeserver/ {
            proxy_pass http://purebliss-code-server:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Code Server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Keycloak - Authentication Service
        location /auth/ {
            proxy_pass http://purebliss-keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vault - Secrets Management
        location /vault/ {
            proxy_pass http://purebliss-vault:8200/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana - Monitoring Dashboard
        location /grafana/ {
            proxy_pass http://purebliss-grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Pure Bliss Elite Social Media Platform - Healthy\nTarget: 107,500 customers/year, 75K Instagram, 50K YouTube\n";
            add_header Content-Type text/plain;
        }

        # Default location - Pure Bliss platform info
        location / {
            return 200 "Pure Bliss Elite Social Media Platform\nDevelopment Environment: dev.purebliss.app\nTarget Metrics: 107,500 customers/year, 75K Instagram, 50K YouTube\n";
            add_header Content-Type text/plain;
        }
    }
}
