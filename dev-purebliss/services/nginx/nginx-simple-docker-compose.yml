services:
  nginx:
    build:
      context: .
      dockerfile: nginx-simple-dockerfile
    container_name: purebliss-nginx-simple
    ports:
      - "80:80"
    volumes:
      - ${RAID0_MOUNT}/nginx/html:/var/www/html
      - ${RAID0_MOUNT}/logs:/var/log/nginx
    env_file:
      - /opt/my-secure-ha-stack/config.env
    networks:
      - purebliss-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  purebliss-net:
    external: true
