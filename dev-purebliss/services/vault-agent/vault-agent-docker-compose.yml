services:
  vault-agent:
    build:
      context: .
      dockerfile: vault-agent-dockerfile
    container_name: purebliss-vault-agent
    volumes:
      - ${VAULT_AGENT_CONFIG_PATH}:/etc/vault-agent/config.hcl
      - ${VAULT_AGENT_OUTPUT_PATH}:/vault/agent/output
      - ./vault-agent:/vault-agent
    env_file:
      - /opt/my-secure-ha-stack/config.env
    networks:
      - purebliss-net
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  purebliss-net:
    external: true
