services:
  vault:
    image: hashicorp/vault:1.17.3
    container_name: purebliss-vault
    ports:
      - "18200:18200"
    volumes:
      - ${VAULT_DATA_PATH}:/vault/data
      - ${VAULT_TLS_PATH}:/vault/tls:ro
      - .config.hcl:/vault/config/config.hcl:ro
    env_file:
      - /opt/my-secure-ha-stack/config.env
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/config.hcl
    networks:
      - purebliss-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  purebliss-net:
    external: true
