version: '3.8'
services:
  nginx:
    image: nginx:latest
    container_name: purebliss-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8200:8200" # Expose Vault HTTPS
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /opt/dev-purebliss/web/tools:/opt/dev-purebliss/web/tools:ro
    networks:
      - purebliss-net
    depends_on:
      - vault
    restart: unless-stopped
  vault:
    image: vault:1.13.3
    container_name: purebliss-vault
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/data
    ports:
      - "18200:8200"
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -config=/vault/config/vault-server.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_SKIP_VERIFY=true
    networks:
      - purebliss-net
    restart: unless-stopped

  vault-agent:
    image: vault:1.13.3
    container_name: purebliss-vault-agent
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault/agent:/vault/config:ro
      - ./vault/unseal:/vault/unseal
      - ./secrets:/opt/my-secure-ha-stack/secrets:ro
    command: sh -c "sleep 5 && vault agent -config=/vault/config/agent-config.hcl"
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep 'vault agent' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_SKIP_VERIFY=true
    networks:
      - purebliss-net
    restart: unless-stopped

volumes:
  vault_data:

networks:
  purebliss-net:
    external: true
