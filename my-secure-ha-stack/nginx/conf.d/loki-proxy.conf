# Auto-generated proxy configuration for loki
# Generated: Thu Aug  7 11:46:19 AM EDT 2025
# Container: loki_phase1_manual

upstream loki_backend {
    server loki_phase1_manual:3100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

location /loki {
    proxy_pass http://loki_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Health check specific settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    
    # Error handling
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
}

# Health check endpoint for loki
location /loki/health {
    access_log off;
    proxy_pass http://loki_backend/ready;
    proxy_set_header Host $host;
}
