version: '3.8'
services:
  purebliss-grafana:
    image: grafana/grafana:10.1.0
    container_name: purebliss-grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "3001:3000"
    entrypoint: ["/opt/vault-entrypoint.sh"]
    volumes:
      - ${GRAFANA_DATA_PATH}:/var/lib/grafana
      - ./vault-entrypoint.sh:/opt/vault-entrypoint.sh:ro
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
