version: '3.8'
services:
  purebliss-grafana:
    image: grafana/grafana:10.1.0
    container_name: purebliss-grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "3001:3000"
    volumes:
      - /raid-storage/grafana/data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
