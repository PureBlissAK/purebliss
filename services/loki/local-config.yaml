
# Loki config for Pure Bliss: single-tenant, RAID-backed storage
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  target: all

common:
  path_prefix: /raid-storage/loki
  storage:
    filesystem:
      chunks_directory: /raid-storage/loki/chunks
      rules_directory: /raid-storage/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Analytics
analytics:
  reporting_enabled: false

# Limits
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h

# Ingester and WAL configuration (required for persistence)
ingester:
  wal:
    enabled: true
    dir: /raid-storage/loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s

# Chunk store config
chunk_store_config:
  max_look_back_period: 0s

# Table manager
table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

# Compactor - configured for proper operation
compactor:
  working_directory: /raid-storage/loki/boltdb-shipper-compactor
  shared_store: filesystem

# Memberlist config for clustering (disabled for single instance)
memberlist:
  bind_port: 7946
  join_members: []
