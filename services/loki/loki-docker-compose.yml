version: '3.8'
services:
  purebliss-loki:
    image: grafana/loki:2.9.0
    container_name: purebliss-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ${LOKI_DATA_PATH}:/loki
      - ${LOKI_LOG_PATH}:/var/log/loki/loki.log
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
