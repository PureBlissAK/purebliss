version: '3.8'
services:
  purebliss-prometheus:
    image: prom/prometheus:2.47.0
    container_name: purebliss-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ${PROMETHEUS_DATA_PATH}:/prometheus
      - ${PROMETHEUS_LOG_PATH}:/var/log/prometheus/prometheus.log
      - /opt/my-secure-ha-stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
