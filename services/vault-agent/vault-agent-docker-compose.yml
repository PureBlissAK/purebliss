services:
  vault-agent:
    build:
      context: .
      dockerfile: vault-agent-dockerfile
    container_name: purebliss-vault-agent
    volumes:
      # Vault Agent configuration
      - ./config.hcl:/etc/vault-agent/config.hcl:ro
      # AppRole credentials (mounted from host secrets)
      - /opt/my-secure-ha-stack/secrets/vault-agent-role-id/role_id:/vault/secrets/role_id:ro
      - /opt/my-secure-ha-stack/secrets/vault-agent-secret-id/secret_id:/vault/secrets/secret_id:ro
      # Output directory for generated tokens and credentials
      - ./output:/vault/agent/output
      # Templates for credential generation
      - ./templates:/vault/templates:ro
      # Logs directory
      - ./logs:/vault/agent/logs
    environment:
      - VAULT_ADDR=https://purebliss-vault:8200
      - VAULT_SKIP_VERIFY=1
    networks:
      - purebliss-net
    cap_add:
      - IPC_LOCK
    external_links:
      - vault:vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
networks:
  purebliss-net:
    external: true
