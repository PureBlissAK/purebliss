version: '3.8'

services:
  purebliss-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: purebliss-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secure_2025
      KC_DB: postgres
      KC_DB_URL_HOST: purebliss-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secure_2025
      KC_HOSTNAME: dev.purebliss.app
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
    command: |
      bash -c '
        echo "[Wed Aug  6 06:18:22 PM EDT 2025] Waiting for PostgreSQL..."
        until nc -z purebliss-postgres 5432; do
          echo "[Wed Aug  6 06:18:22 PM EDT 2025] PostgreSQL not ready, waiting..."
          sleep 5
        done

        echo "[Wed Aug  6 06:18:22 PM EDT 2025] Testing database connection..."
        export PGPASSWORD=keycloak_secure_2025
        until docker exec purebliss-postgres psql -U keycloak -d keycloak -c "SELECT 1;" > /dev/null 2>&1; do
          echo "[Wed Aug  6 06:18:22 PM EDT 2025] Database connection failed, waiting..."
          sleep 10
        done

        echo "[Wed Aug  6 06:18:22 PM EDT 2025] Database connection successful, starting Keycloak..."
        exec /opt/keycloak/bin/kc.sh start-dev
      '
    external_links:
      - purebliss-postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - purebliss-net

networks:
  purebliss-net:
    external: true
