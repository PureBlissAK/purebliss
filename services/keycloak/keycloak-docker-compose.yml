version: '3.8'
services:
  purebliss-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: purebliss-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: ["/opt/vault-entrypoint.sh"]
    volumes:
      - ./vault-entrypoint.sh:/opt/vault-entrypoint.sh:ro
    environment:
      # Vault settings for credential fetch
      VAULT_ADDR: ${VAULT_ADDR:-http://purebliss-vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN}
      # PostgreSQL connection settings for Vault script
      POSTGRES_HOST: purebliss-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      # Keycloak admin user, password fetched by entrypoint
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      # Proxy and hostname
      KC_HOSTNAME: dev.purebliss.app
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
