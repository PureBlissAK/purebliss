version: '3.8'
services:
  purebliss-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: purebliss-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["start", "--optimized"]
    environment:
      # Production Database settings
      KC_DB: postgres
      KC_DB_URL_HOST: purebliss-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Production Redis Cache settings
      KC_CACHE: redis
      KC_CACHE_REDIS_HOST: purebliss-redis
      KC_CACHE_REDIS_PORT: "6379"
      # Keycloak admin user
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Proxy and hostname for production
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: dev.purebliss.app
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      - purebliss-postgres
      - purebliss-redis
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -t1 response <&3 && exec 3<&- && exec 3>&- || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
