
# docker-compose.yml for Vault service

services:
  vault:
    build:
      context: .
      dockerfile: vault-dockerfile.yml
    container_name: purebliss-vault
    restart: unless-stopped

    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      # VAULT_SKIP_VERIFY is needed for the healthcheck and initial CLI interactions
      # with self-signed certs. Remove or use caution in production for client apps.
      VAULT_SKIP_VERIFY: "true"

    ports:
      - "8200:8200" # Vault HTTP/HTTPS listener
      - "8201:8201" # Vault cluster listener for Raft

    volumes:
      # Mount the Vault HCL configuration (TLS enabled)
      - ./vault.hcl:/vault/config/vault.hcl:ro
      # Mount the directory containing your TLS certificates.
      - ./certs:/vault/certs:ro
      # Named volumes for Vault's persistent storage (Raft) and logs
      - vaultdata:/vault/data
      - vaultlogs:/vault/logs

    command: ["vault", "server", "-config=/vault/config/vault.hcl"]

    cap_add:
      - IPC_LOCK # Prevent Vault from being swapped to disk (security)

    # Use default entrypoint

    healthcheck:
      test: ["CMD-SHELL", "vault status -tls-skip-verify || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Give Vault time to initialize

    networks:
      - purebliss-net # Connect Vault to your shared network

    secrets:
      - postgres_password # Reference the Docker secret by its name

  # NEW SERVICE: Vault Agent
  vault-agent:
    image: hashicorp/vault:1.17.3 # Using the official Vault image for agent
    container_name: purebliss-vault-agent
    restart: unless-stopped
    command: "agent -config=/vault/agent/config.hcl" # Tells Vault to run in agent mode
    volumes:
      - ./vault-agent-config:/vault/agent:ro # Mounts agent config & creds
      - vault-agent-data:/var/run/vault:rw # Agent writes secrets/tokens here
    environment:
      VAULT_ADDR: https://vault:8200 # Important: Use the service name `vault` for inter-container communication
      VAULT_SKIP_VERIFY: "true" # Agent needs this for self-signed Vault certs
    cap_add:
      - IPC_LOCK # Prevent Vault Agent from being swapped to disk (security)
    networks:
      - purebliss-net # Connect to the same network as Vault
    depends_on:
      - vault # Ensure Vault server is up before agent tries to connect

# Define named volumes for Vault's persistent data
volumes:
  vaultdata:
  vaultlogs:
  vault-agent-data:

# Define the shared external network
networks:
  purebliss-net:
    external: true # Assumes this network is created once manually

# Define the Docker secret
secrets:
  postgres_password:
    file: /opt/dev-purebliss/secrets/postgres_password.txt
