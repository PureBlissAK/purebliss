services:
  vault:
    image: hashicorp/vault:1.17.3
    container_name: purebliss-vault
    ports:
      - "18200:18200"
    volumes:
      - vault-data:/vault/data
      - ./config.hcl:/vault/config/config.hcl:ro
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/config.hcl
    networks:
      - purebliss-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  purebliss-net:
    external: true

volumes:
  vault-data:
    driver: local
