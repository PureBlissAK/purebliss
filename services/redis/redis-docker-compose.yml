version: '3.8'
services:
  redis:
    build: .
    image: purebliss-redis:latest
    container_name: purebliss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Optional: Mount custom config if needed
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /raid-storage/redis/data:/data
      - ${REDIS_LOG_PATH}:/var/log/redis/redis.log
    # environment:
    #   - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - purebliss-net
    labels:
      org.purebliss.service: "redis"
      org.purebliss.role: "cache"
    # Resource limits for optimal performance
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
networks:
  purebliss-net:
    external: true
