version: '3.8'
services:
  purebliss-redis:
    image: redis:7
    container_name: purebliss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    entrypoint: ["/opt/vault-entrypoint.sh"]
    volumes:
      - ${REDIS_DATA_PATH}:/data
      - ${REDIS_LOG_PATH}:/var/log/redis/redis.log
      - ./vault-entrypoint.sh:/opt/vault-entrypoint.sh:ro
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
