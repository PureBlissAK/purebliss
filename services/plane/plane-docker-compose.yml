version: '3.8'
services:
  purebliss-plane:
    image: plane/quickstart:latest
    container_name: purebliss-plane
    restart: unless-stopped
    ports:
      - "8081:3456"
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: ${POSTGRES_HOST}
      VIKUNJA_DATABASE_PORT: ${POSTGRES_PORT}
      VIKUNJA_DATABASE_DATABASE: ${POSTGRES_DB}
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_SERVICE_FRONTENDURL: https://dev.purebliss.app/plane
    volumes:
      - ${PLANE_DATA_PATH}:/app/vikunja/files
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3456/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
