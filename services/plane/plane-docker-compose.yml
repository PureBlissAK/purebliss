version: '3.8'
services:
  purebliss-plane:
    image: purebliss-plane:latest
    container_name: purebliss-plane
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      # Plane app environment variables (set via Vault or .env)
      PLANE_DB_USER: ${PLANE_DB_USER}
      PLANE_DB_PASSWORD: ${PLANE_DB_PASSWORD}
      PLANE_DB_HOST: ${PLANE_DB_HOST}
      PLANE_DB_PORT: ${PLANE_DB_PORT}
      PLANE_DB_NAME: ${PLANE_DB_NAME}
    volumes:
      - /raid-storage/plane/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
