version: '3.8'
services:
  purebliss-codeserver:
    image: codercom/code-server:4.20.0
    container_name: purebliss-codeserver
    restart: unless-stopped
    ports:
      - "8444:8080"
    environment:
      - PASSWORD=${CODESERVER_PASSWORD:-changeme-secure-password}
      - VAULT_ADDR=${VAULT_ADDR:-http://purebliss-vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
    volumes:
      - /raid-storage/codeserver/data:/home/coder/project
      - ${CODESERVER_LOG_PATH:-/tmp/codeserver.log}:/var/log/codeserver/codeserver.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
