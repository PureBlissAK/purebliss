services:
  nginx:
    image: nginx:latest
    container_name: purebliss-nginx-dev
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../letsencrypt/webroot:/var/www/certbot:ro
    networks:
      - purebliss-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  purebliss-net:
    external: true
