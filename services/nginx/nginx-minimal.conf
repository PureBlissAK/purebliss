user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # Upstream definitions for currently running services only
    upstream vault {
        server purebliss-vault:18200;
    }

    upstream postgres_health {
        server purebliss-postgres:5432;
    }

    upstream redis_health {
        server purebliss-redis:6379;
    }

    # Default server for HTTPS with self-signed certificate
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name dev.purebliss.app;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/dev.purebliss.app.crt;
        ssl_certificate_key /etc/nginx/certs/dev.purebliss.app.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Root directory
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Health check endpoint
        location /health {
            return 200 "Pure Bliss Infrastructure - OK\n";
            add_header Content-Type text/plain;
        }

        # Vault API
        location /vault/ {
            proxy_pass http://vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default location
        location / {
            return 200 "Pure Bliss Elite Social Media Technology Stack\nInfrastructure Status: Deploying...\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name dev.purebliss.app;
        return 301 https://$server_name$request_uri;
    }
}
