# Nginx Minimal Configuration for Build Validation (No SSL Required)
# This config works without SSL certificates for testing nginx Phase 2

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Pure Bliss Services Configuration (Minimal for Current Setup)
    # Only include services that are currently running: vault, vault-agent, postgres, redis

    # Vault service (running on port 8200)
    upstream vault {
        server purebliss-vault:8200 max_fails=3 fail_timeout=10s;
    }

    # HTTP Server (no SSL for build validation)
    server {
        listen 80;
        listen [::]:80;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # Vault API proxy (only running service route currently enabled)
        location /vault/ {
            proxy_pass http://vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "nginx minimal - running services: vault, vault-agent, postgres, redis\n";
            add_header Content-Type text/plain;
        }

        # Default location
        location / {
            return 200 "Pure Bliss Elite Infrastructure - Build Validation Mode\nRunning Services: vault, vault-agent, postgres, redis\nAvailable Routes:\n- /vault/ - Vault API Proxy\n- /health - Health Check\n";
            add_header Content-Type text/plain;
        }
    }
}
