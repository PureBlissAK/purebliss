server {
    listen 80;
    listen [::]:80;
    server_name dev.purebliss.app localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default location for testing
    location / {
        return 200 "Nginx with Vault Integration - Pure Bliss Development (HTTP)\nStatus: Running independently\nTimestamp: $time_iso8601\n";
        add_header Content-Type text/plain;
    }

    # Info endpoint
    location /info {
        return 200 "Nginx Independent Service\nContainer: nginx\nNetwork: purebliss-net\nVault Integration: Available\n";
        add_header Content-Type text/plain;
    }
}
