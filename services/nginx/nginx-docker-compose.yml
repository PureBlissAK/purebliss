version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: nginx-dockerfile
    image: purebliss-nginx:latest
    container_name: purebliss-nginx
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-true}
      DOMAIN: ${DOMAIN:-dev.purebliss.app}
      USE_VAULT: ${USE_VAULT:-true}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      VAULT_DEV_TOKEN: ${VAULT_DEV_TOKEN:-}
    volumes:
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
      - /opt/my-secure-ha-stack/logs:/opt/my-secure-ha-stack/logs
    networks:
      - purebliss-net
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || curl -fk https://localhost:443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local

networks:
  purebliss-net:
    driver: bridge
    external: true
