# Nginx Configuration with SSL/TLS Only (Minimal for Gateway Testing)
# Optimized for Pure Bliss SSL/TLS Compliance

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Optimize for high concurrency
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # SSL/TLS settings - Vault PKI generated certificates
        ssl_certificate /etc/nginx/certs/live/dev.purebliss.app/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/dev.purebliss.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # HTTP Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Pure Bliss HTTPS Gateway - Healthy\n";
            add_header Content-Type text/plain;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # Default location - SSL/TLS compliance verification
        location / {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            return 200 "Pure Bliss HTTPS Gateway is operational. SSL/TLS certificates from Vault PKI are working correctly.\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTP to HTTPS redirect (SSL/TLS enforcement)
    server {
        listen 80;
        listen [::]:80;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # Strict HTTPS redirect
        return 301 https://$server_name$request_uri;
    }
}
