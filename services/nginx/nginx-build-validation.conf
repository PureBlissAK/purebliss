# HTTP-Only Nginx Configuration for Build Validation - Phase 2
# This configuration allows Phase 2 builds to succeed without SSL requirements

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Vault upstream (current running service)
    upstream vault {
        server purebliss-vault:8200 max_fails=3 fail_timeout=10s;
    }

    # HTTP Server (build validation only)
    server {
        listen 80;
        listen [::]:80;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # Vault API proxy (available service)
        location /vault/ {
            proxy_pass http://vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "nginx healthy - build validation mode (HTTP only)\n";
            add_header Content-Type text/plain;
        }

        # Service status endpoint
        location /status {
            access_log off;
            return 200 "{\"status\":\"healthy\",\"mode\":\"build_validation\",\"protocol\":\"http_only\",\"available_services\":[\"vault\"]}";
            add_header Content-Type application/json;
        }

        # Default location
        location / {
            return 200 "Pure Bliss Development Environment - Build Validation Mode\nHTTP Only - SSL will be enabled in production\nAvailable: vault";
            add_header Content-Type text/plain;
        }
    }
}
