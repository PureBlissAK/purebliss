# Smart Nginx Configuration for Pure Bliss - Phase 2+ Compatible
# Handles missing SSL certificates and upstream services gracefully

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Vault upstream (current running service)
    upstream vault {
        server purebliss-vault:8200 max_fails=3 fail_timeout=10s;
    }

    # HTTPS Server with fallback SSL certificates
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # SSL/TLS settings with fallback paths
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Vault API proxy (only available service)
        location /vault/ {
            proxy_pass http://vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "nginx healthy - smart upstream mode\n";
            add_header Content-Type text/plain;
        }

        # Service status endpoint
        location /status {
            access_log off;
            return 200 "{\"status\":\"healthy\",\"mode\":\"smart_upstream\",\"ssl\":\"fallback\",\"available_services\":[\"vault\"]}";
            add_header Content-Type application/json;
        }

        # Default location
        location / {
            return 200 "Pure Bliss Development Environment - Smart Upstream Mode\nAvailable: vault\nStarting: other services";
            add_header Content-Type text/plain;
        }
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name dev.purebliss.app *.dev.purebliss.app;

        # Health check for HTTP
        location /health {
            access_log off;
            return 200 "nginx healthy (HTTP)\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
}
