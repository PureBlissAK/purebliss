version: '3.8'

services:
  purebliss-postgres:
    image: postgres:16
    container_name: purebliss-postgres
    restart: unless-stopped
    networks:
      - purebliss-net
    environment:
      # Fresh PostgreSQL setup with proper superuser
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bootstrap_admin_password_12345
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Use a fresh volume name to ensure clean start
      - fresh_pgdata:/var/lib/postgresql/data
      # Create initialization script for additional users
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  purebliss-net:
    external: true

volumes:
  fresh_pgdata:
    driver: local
