version: '3.8'
services:
  purebliss-postgres:
    image: postgres:16
    container_name: purebliss-postgres
    restart: unless-stopped
    user: "999:999"
    ports:
      - "5432:5432"
    entrypoint: /opt/vault-entrypoint.sh
    command: ["postgres"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://purebliss-vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      - ${POSTGRES_LOG_PATH}:/var/log/postgresql/postgres.log
      - ./vault-entrypoint.sh:/opt/vault-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purebliss-net
networks:
  purebliss-net:
    external: true
